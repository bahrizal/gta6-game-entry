<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Heat — an open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0e1a; height: 100%; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
  canvas { width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); background: #1a2a1a; display: block; }
  #status { color: #8a93a8; font: 13px system-ui, sans-serif; padding: 6px 0 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="status">Solmar Heat — loading…</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
